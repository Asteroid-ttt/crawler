[project]
name = "crawler"
version = "0.2.0"
description = "Multi-college teacher information crawler for Wuhan University"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "requests>=2.32.5",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
